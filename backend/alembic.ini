# Alembic configuration file
# SQLAlchemy URL - uses DATABASE_URL from environment

sqlalchemy.url = driver://user:password@localhost/dbname

# The encoding of the output file to be written to disk.
sqlalchemy_echo = false

# The maximum length of characters to apply to the
# "slug" field in the revision file name. Default is
# 40 which was the old default for Alembic. The
# latest functions in the sqlalchemy driver show
# versions with a max length of 32 so pick any
# length >= 32 to avoid truncation of branch names.
truncate_slug_length = 40

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
